<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>spectralTAD GM12878 boundaries</title>
  <script src="https://cdn.jsdelivr.net/npm/igv@3.7.1/dist/igv.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #f7f9fc;
      color: #1d2a3a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      box-sizing: border-box;
      margin: 0 auto;
      max-width: 1400px;
      padding: 2rem;
    }

    h1 {
      margin: 0 0 .4rem;
      font-size: 1.65rem;
    }

    p {
      margin: 0 0 1.5rem;
    }

    #igv-container {
      min-height: 500px;
      border: 1px solid #d5dce5;
      border-radius: .5rem;
      background: #fff;
    }
  </style>
</head>
<body>
  <main>
    <h1>spectralTAD GM12878 boundaries</h1>
    <p>5 kb spectralTAD boundaries on the hg38 reference genome.</p>
    <div id="igv-container"></div>
  </main>
  <script>
    const options = {
      genome: "hg38",
      locus: "chr1:1-10,000,000",
      tracks: [{
        name: "spectralTAD boundaries (GM12878, 5 kb)",
        type: "annotation",
        format: "bigBed",
        url: "https://raw.githubusercontent.com/mdozmorov/test/main/boundary_spectralTAD_5kb.hg38.bb",
        color: "#2867a7",
        displayMode: "EXPANDED"
      }]
    };

    igv.createBrowser(document.getElementById("igv-container"), options);
  </script>
</body>
</html>
