<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>EpiTADformer GM12878 boundary viewer</title>

  <script src="https://cdn.jsdelivr.net/npm/igv@3.7.1/dist/igv.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #f7f9fc;
      color: #1d2a3a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
    }

    main {
      box-sizing: border-box;
      margin: 0 auto;
      max-width: 1400px;
      padding: 2rem;
    }

    h1 {
      margin: 0 0 .4rem;
      font-size: 1.65rem;
    }

    p {
      margin: 0 0 1.5rem;
    }

    #igv-container {
      min-height: 500px;
      border: 1px solid #d5dce5;
      border-radius: .5rem;
      background: #fff;
    }
  </style>
</head>

<body>

  <main>

    <h1>EpiTADformer GM12878 boundaries</h1>

    <p>
      EpiTADformer predicted boundary regions and associated
      epigenomic signals on the hg38 reference genome.
    </p>

    <div id="igv-container"></div>

  </main>

  <script>

    const options = {

      genome: "hg38",

      locus: "chr9:73,313,708-73,854,312",

      tracks: [

          {
            name: "GM12878 CTCF",
            type: "wig",
            format: "bigwig",
            url: "https://raw.githubusercontent.com/dozmorovlab/EpiTADformer/main/igv/data/GM12878_CTCF.bw",
            color: "#4527a0",
            displayMode: "EXPANDED"
          },
          
          {
            name: "GM12878 RAD21",
            type: "wig",
            format: "bigwig",
            url: "https://raw.githubusercontent.com/dozmorovlab/EpiTADformer/main/igv/data/GM12878_RAD21.bw",
            color: "#7e57c2",
            displayMode: "EXPANDED"
          },
          
          {
            name: "GM12878 SMC3",
            type: "wig",
            format: "bigwig",
            url: "https://raw.githubusercontent.com/dozmorovlab/EpiTADformer/main/igv/data/GM12878_SMC3.bw",
            color: "#b39ddb",
            displayMode: "EXPANDED"
          },
          
          {
            name: "EpiTADformer boundary regions",
            type: "annotation",
            format: "bed",
            url: "https://raw.githubusercontent.com/dozmorovlab/EpiTADformer/main/igv/data/Region_All_consensus_filtered_boundaryRegion_ALL.bed",
            color: "#d62728",
            displayMode: "EXPANDED"
          }

      ]

    };


    igv.createBrowser(
      document.getElementById("igv-container"),
      options
    );

  </script>

</body>
</html>
