[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "epitadformer"
version = "0.1.0"
description = "Prediction of TAD boundaries using epigenomic features"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "tensorflow>=2.15",
    "scikit-learn>=1.3"
]

[project.scripts]
epitadformer-train = "epitadformer.train:main"
epitadformer-predict = "epitadformer.predict:main"
epitadformer-data-train = "epitadformer.data_train:main"